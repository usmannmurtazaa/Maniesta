        :root {

            --bg-secondary: #0f0f1a;

            --text-primary: #e8e8f0;
            --text-secondary: #9898b0;
            --text-muted: #606070;
            --cyan: #22d3ee;
            --blue: #3b82f6;
            --indigo: #6366f1;

        * {

            padding: 0;

        html {

            scrollbar-width: thin;
            scrollbar-color: #2a2a3a #0a0a0f;

            -moz-osx-font-smoothing: grayscale;
            line-height: 1.6;

        ::-webkit-scrollbar {

        }

        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a4a;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 9998;
            opacity: 0.025;

            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }
        .gradient-text {
            background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 25%, #8b5cf6 50%, #a855f7 75%, #d946ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Navigation */
        .nav-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(10, 10, 15, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .nav-link {
            position: relative;
            transition: color 0.3s ease;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            font-family: var(--font-body);
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #22d3ee, #8b5cf6);
            transition: width 0.3s ease;
            border-radius: 1px;
        }
        .nav-link:hover::after {
            width: 100%;
        }
        .nav-link:hover {
            color: #fff;
        }

        /* Hero */
        .hero-container {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0 1rem;
        }
        #wavy-bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .lamp-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .lamp-glow {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(ellipse at top, rgba(34, 211, 238, 0.25) 0%, rgba(59, 130, 246, 0.15) 30%, transparent 70%);
            filter: blur(60px);
            pointer-events: none;
            animation: lampPulse 4s ease-in-out infinite;
        }
        @keyframes lampPulse {
            0%,
            100% {
                opacity: 0.7;
                transform: translateX(-50%) scaleY(1);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scaleY(1.1);
            }
        }
        .lamp-beam {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 60px;
            background: radial-gradient(ellipse at center, rgba(34, 211, 238, 0.3) 0%, rgba(59, 130, 246, 0.12) 40%, transparent 70%);
            filter: blur(30px);
            pointer-events: none;
        }
        #sparkles-canvas {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            pointer-events: none;
        }

        /* Text hover effect */
        .text-hover-container {
            position: relative;
            cursor: pointer;
            z-index: 3;
            display: inline-block;
            width: 100%;
            max-width: 800px;
        }
        .text-hover-container svg {
            width: 100%;
            height: auto;
            overflow: visible;
            display: block;
        }

        /* Project cards */
        .project-card-3d {
            perspective: 1000px;
            transform-style: preserve-3d;
            transition: transform 0.25s ease;
            cursor: pointer;
            position: relative;
        }
        .project-card-inner {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: linear-gradient(160deg, rgba(20, 20, 35, 0.9), rgba(10, 10, 20, 0.95));
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transform-style: preserve-3d;
        }
        .project-card-inner:hover {
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 40px rgba(139, 92, 246, 0.1), 0 0 80px rgba(34, 211, 238, 0.05);
        }
        .project-thumbnail {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .project-thumbnail .thumb-bg {
            position: absolute;
            inset: 0;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }
        .project-card-inner:hover .thumb-bg {
            opacity: 0.75;
        }
        .project-thumbnail .thumb-initial {
            position: relative;
            z-index: 1;
            font-size: 3rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            font-family: var(--font-display);
        }

        /* Globe */
        .globe-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        #globe-canvas {
            width: 100%;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.1);
        }

        /* Tracing beam */
        .tracing-beam-container {
            position: relative;
        }
        .tracing-beam-line {
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }
        .tracing-beam-progress {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0;
            background: linear-gradient(180deg, #22d3ee, #3b82f6, #8b5cf6, #d946ef);
            border-radius: 1px;
            transition: height 0.1s linear;
        }
        .tracing-beam-dot {
            position: absolute;
            left: 19px;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8b5cf6;
            box-shadow: 0 0 12px #8b5cf6, 0 0 24px #8b5cf6;
            z-index: 2;
            transition: top 0.1s linear;
        }

        /* Filter pills */
        .filter-pill {
            padding: 10px 22px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 15, 25, 0.6);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            user-select: none;
            font-family: var(--font-body);
        }
        .filter-pill:hover {
            border-color: rgba(139, 92, 246, 0.4);
            color: var(--text-primary);
            background: rgba(139, 92, 246, 0.1);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.1);
        }
        .filter-pill.active {
            border-color: rgba(139, 92, 246, 0.6);
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.15), rgba(139, 92, 246, 0.2));
            color: #fff;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.2), 0 0 60px rgba(34, 211, 238, 0.08);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #d946ef);
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
            font-family: var(--font-body);
            text-decoration: none;
        }
        .btn-primary:hover {

            transform: translateY(-2px);
        }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 9999px;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-family: var(--font-body);
            text-decoration: none;

            background: rgba(139, 92, 246, 0.1);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);

            border: 1px solid rgba(255, 255, 255, 0.08);

            user-select: none;
            position: relative;
            overflow: hidden;
            text-align: center;

            -webkit-text-fill-color: transparent;
            background-clip: text;

            font-size: 0.9rem;
            color: var(--text-primary);

            inset: 0;
            background-image: radial-gradient(circle, rgba(139, 92, 246, 0.08) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        }

        /* Reveal animation */
        .reveal-hidden {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .reveal-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Parallax */
        .parallax-container {
            perspective: 1000px;
            transform-style: preserve-3d;
            overflow: hidden;
        }
        .parallax-row {
            display: flex;
            gap: 20px;
            will-change: transform;
            transform-style: preserve-3d;
            margin-bottom: 16px;
        }

        /* Section styling */
        .section {
            position: relative;
            padding: 80px 0;
        }
        .section-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: var(--font-display);
            letter-spacing: -0.03em;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .section-description {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 600px;
        }

        /* Mobile menu */
        .mobile-menu {
            display: none;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 16px;
        }
        .mobile-menu.open {
            display: block;
            animation: fadeSlideDown 0.3s ease;
        }
        @keyframes fadeSlideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading */
        .loader-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            transition: opacity 0.4s ease;
        }
        .loader-spinner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8b5cf6;
            animation: spin 1.2s linear infinite;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Stats */
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: var(--font-display);
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #22d3ee, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .section-title {
                font-size: 1.8rem;
            }
            .stat-value {
                font-size: 2rem;
            }
            .lamp-glow {
                width: 300px;
                height: 200px;
                top: -40px;
            }
            .project-thumbnail {
                height: 150px;
            }
            .project-thumbnail .thumb-initial {
                font-size: 2rem;
            }
            .section {
                padding: 60px 0;
            }
            .globe-wrapper {
                max-width: 100%;
            }
            #globe-canvas {
                height: 320px;
            }
        }
        @media (max-width: 480px) {
            .section-title {
                font-size: 1.5rem;
            }
            .btn-primary,
            .btn-secondary {
                padding: 10px 20px;
                font-size: 0.85rem;
            }
            .lamp-glow {
                width: 200px;
                height: 150px;
                top: -20px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>

            // ──────────────────────────────────────────────
            // HOOK: useReveal (IntersectionObserver)
            // ──────────────────────────────────────────────
            function useReveal() {
                const ref = useRef(null);
                const [visible, setVisible] = useState(false);
                useEffect(() => {
                    const el = ref.current;
                    if (!el) return;
                    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                        setVisible(true);
                        return;
                    }
                    const observer = new IntersectionObserver(
                        (entries) => {
                            entries.forEach((entry) => {
                                if (entry.isIntersecting) {
                                    setVisible(true);
                                    observer.unobserve(entry.target);
                                }
                            });
                        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
                    );
                    observer.observe(el);
                    return () => observer.disconnect();
                }, []);
                return [ref, visible];
            }

            // ──────────────────────────────────────────────
            // COMPONENT: WavyBackground
            // ──────────────────────────────────────────────
            function WavyBackground({ colors, blur, speed, waveOpacity, className }) {
                const canvasRef = useRef(null);
                const animationRef = useRef(null);
                const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                useEffect(() => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    let width = canvas.width = canvas.offsetWidth;
                    let height = canvas.height = canvas.offsetHeight;
                    let time = 0;
                    const colorValues = (colors || ['#22d3ee', '#3b82f6', '#6366f1', '#8b5cf6', '#a855f7', '#d946ef']).map(c => {
                        const r = parseInt(c.slice(1, 3), 16);
                        const g = parseInt(c.slice(3, 5), 16);
                        const b = parseInt(c.slice(5, 7), 16);
                        return [r, g, b];
                    });
                    const speedFactor = speed === 'fast' ? 0.01 : speed === 'medium' ? 0.006 : 0.003;
                    const bval = blur || 30;
                    const wop = waveOpacity || 0.5;

                    function drawWave(offsetY, amplitude, frequency, phase, color, opacity) {
                        ctx.beginPath();
                        ctx.moveTo(0, height / 2);
                        for (let x = 0; x <= width; x += 3) {
                            const y = offsetY + Math.sin(x * frequency + time + phase) * amplitude +
                                Math.cos(x * frequency * 0.7 + time * 1.3 + phase) * amplitude * 0.5;
                            ctx.lineTo(x, y);
                        }
                        ctx.strokeStyle = 'rgba(' + color[0] + ',' + color[1] + ',' + color[2] + ',' + opacity + ')';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }

                    function animate() {
                        ctx.clearRect(0, 0, width, height);
                        ctx.filter = 'blur(' + bval + 'px)';
                        const centerY = height * 0.5;
                        colorValues.forEach(function(color, i) {
                            const offsetY = centerY + (i - colorValues.length / 2) * 20;
                            const amplitude = 30 + i * 8;
                            const frequency = 0.005 + i * 0.001;
                            const opacity = wop * (1 - i * 0.08);
                            drawWave(offsetY, amplitude, frequency, i * 0.8, color, Math.max(0.05, opacity));
                        });
                        ctx.filter = 'none';
                        time += reducedMotion ? 0 : speedFactor;
                        animationRef.current = requestAnimationFrame(animate);
                    }
                    animate();
                    const handleResize = function() {
                        width = canvas.width = canvas.offsetWidth;
                        height = canvas.height = canvas.offsetHeight;
                    };
                    window.addEventListener('resize', handleResize);
                    return function() {
                        cancelAnimationFrame(animationRef.current);
                        window.removeEventListener('resize', handleResize);
                    };
                }, [colors ? colors.join(',') : '', blur, speed, waveOpacity, reducedMotion]);

                return html`<canvas ref=${canvasRef} className=${cn('absolute inset-0 w-full h-full', className)} style=${{ pointerEvents: 'none' }} />`;
            }

            // ──────────────────────────────────────────────
            // COMPONENT: SparklesCore
            // ──────────────────────────────────────────────
            function SparklesCore({ className, particleColor, particleDensity, minSize, maxSize, speed }) {
                const canvasRef = useRef(null);
                const animationRef = useRef(null);
                const particlesRef = useRef([]);
                const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                useEffect(() => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    const width = canvas.width = canvas.offsetWidth;
                    const height = canvas.height = canvas.offsetHeight;
                    const density = particleDensity || 40;
                    const mins = minSize || 0.4;
                    const maxs = maxSize || 1.5;
                    const spd = speed || 0.5;
                    const pColor = particleColor || '#8b5cf6';

                    const particles = [];
                    for (let i = 0; i < density; i++) {
                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            size: Math.random() * (maxs - mins) + mins,
                            alpha: Math.random() * 0.6 + 0.2,
                            vx: (Math.random() - 0.5) * 0.2,
                            vy: (Math.random() - 0.5) * 0.2,
                            twinkleSpeed: Math.random() * 0.02 + 0.01,
                            phase: Math.random() * Math.PI * 2
                        });
                    }
                    particlesRef.current = particles;

                    function animate() {
                        ctx.clearRect(0, 0, width, height);
                        const time = Date.now() * 0.001;
                        particles.forEach(function(p) {
                            p.x += p.vx;
                            p.y += p.vy;
                            p.phase += p.twinkleSpeed;
                            if (p.x < 0) p.x = width;
                            if (p.x > width) p.x = 0;
                            if (p.y < 0) p.y = height;
                            if (p.y > height) p.y = 0;
                            const alpha = p.alpha * (0.5 + 0.5 * Math.sin(p.phase + time * spd));
                            const size = p.size * (0.8 + 0.4 * Math.sin(p.phase * 1.5 + time));
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                            ctx.fillStyle = pColor;
                            ctx.globalAlpha = Math.max(0, alpha);
                            ctx.fill();
                            ctx.globalAlpha = 1;
                        });
                        animationRef.current = requestAnimationFrame(animate);
                    }
                    if (!reducedMotion) {
                        animate();
                    } else {
                        // Draw static particles
                        particles.forEach(function(p) {
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                            ctx.fillStyle = pColor;
                            ctx.globalAlpha = p.alpha;
                            ctx.fill();
                            ctx.globalAlpha = 1;
                        });
                    }
                    const handleResize = function() {
                        canvas.width = canvas.offsetWidth;
                        canvas.height = canvas.offsetHeight;
                    };
                    window.addEventListener('resize', handleResize);
                    return function() {
                        cancelAnimationFrame(animationRef.current);
                        window.removeEventListener('resize', handleResize);
                    };
                }, [particleColor, particleDensity, minSize, maxSize, speed, reducedMotion]);

                return html`<canvas ref=${canvasRef} className=${cn('absolute', className)} style=${{ pointerEvents: 'none' }} />`;
            }

            // ──────────────────────────────────────────────
            // COMPONENT: TracingBeam
            // ──────────────────────────────────────────────
            function TracingBeam({ children, className }) {
                const containerRef = useRef(null);
                const progressRef = useRef(null);
                const dotRef = useRef(null);

                useEffect(() => {
                    const container = containerRef.current;
                    const progress = progressRef.current;
                    const dot = dotRef.current;
                    if (!container || !progress || !dot) return;
                    let rafId = null;

                    const updateBeam = function() {
                        const rect = container.getBoundingClientRect();
                        const scrollY = window.scrollY;
                        const containerTop = rect.top + scrollY;
                        const containerHeight = rect.height;
                        const viewportHeight = window.innerHeight;
                        const start = containerTop - viewportHeight * 0.5;
                        const end = containerTop + containerHeight - viewportHeight * 0.5;
                        const current = scrollY;
                        let pct = 0;
                        if (current > start && current < end) {
                            pct = ((current - start) / (end - start)) * 100;
                        } else if (current >= end) {
                            pct = 100;
                        }
                        progress.style.height = pct + '%';
                        dot.style.top = pct + '%';
                        rafId = null;
                    };
                    const onScroll = function() {
                        if (!rafId) rafId = requestAnimationFrame(updateBeam);
                    };
                    updateBeam();
                    window.addEventListener('scroll', onScroll, { passive: true });
                    window.addEventListener('resize', onScroll);
                    return function() {
                        window.removeEventListener('scroll', onScroll);
                        window.removeEventListener('resize', onScroll);
                        if (rafId) cancelAnimationFrame(rafId);
                    };
                }, []);

                return html`
                    <div ref=${containerRef} className=${cn('tracing-beam-container relative', className)}>
                        <div className="tracing-beam-line">
                            <div ref=${progressRef} className="tracing-beam-progress" />
                        </div>
                        <div ref=${dotRef} className="tracing-beam-dot" />
                        <div style=${{ paddingLeft: '48px' }}>${children}</div>
                    </div>
                `;
            }

            // ──────────────────────────────────────────────
            // COMPONENT: HeroParallax
            // ──────────────────────────────────────────────
            function HeroParallax({ projects }) {
                const containerRef = useRef(null);
                const [scrollData, setScrollData] = useState({ progress: 0, row1X: 0, row2X: 0, row3X: 0, rotateX: 8, rotateZ: 3, translateY: 40, opacity: 0 });

                useEffect(() => {
                    const container = containerRef.current;
                    if (!container) return;
                    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                    let rafId = null;

                    const update = function() {
                        const rect = container.getBoundingClientRect();
                        const scrollY = window.scrollY;
                        const containerTop = rect.top + scrollY;
                        const containerHeight = rect.height;
                        const viewportHeight = window.innerHeight;
                        const start = containerTop - viewportHeight;
                        const end = containerTop + containerHeight;
                        let progress = 0;
                        if (scrollY > start && scrollY < end) {
                            progress = (scrollY - start) / (end - start);
                        } else if (scrollY >= end) {
                            progress = 1;
                        }
                        progress = Math.max(0, Math.min(1, progress));
                        setScrollData({
                            progress: progress,
                            row1X: reducedMotion ? 0 : progress * -300,
                            row2X: reducedMotion ? 0 : progress * 300,
                            row3X: reducedMotion ? 0 : progress * -200,
                            rotateX: reducedMotion ? 0 : 8 - progress * 8,
                            rotateZ: reducedMotion ? 0 : 3 - progress * 5,
                            translateY: reducedMotion ? 0 : 40 - progress * 80,
                            opacity: progress < 0.1 ? progress / 0.1 : (progress > 0.9 ? (1 - progress) / 0.1 : 1)
                        });
                        rafId = null;
                    };
                    const onScroll = function() {
                        if (!rafId) rafId = requestAnimationFrame(update);
                    };
                    update();
                    window.addEventListener('scroll', onScroll, { passive: true });
                    window.addEventListener('resize', onScroll);
                    return function() {
                        window.removeEventListener('scroll', onScroll);
                        window.removeEventListener('resize', onScroll);
                        if (rafId) cancelAnimationFrame(rafId);
                    };
                }, []);

                const row1 = projects.slice(0, 4);
                const row2 = projects.slice(4, 8);
                const row3 = projects.slice(8, 12);

                function renderRow(items, xTransform, keyPrefix) {
                    const allItems = items.concat(items);
                    return html`<div className="parallax-row" style=${{ transform: 'translateX(' + xTransform + 'px)' }}>
                        ${allItems.map(function(project, i) {
                            return html`<div key=${keyPrefix + '-' + project.id + '-' + i} style=${{ flex: '0 0 300px', minWidth: '300px', transformStyle: 'preserve-3d' }}>
                                <${ProjectCard} project=${project} index=${i} />
                            </div>`;
                        })}
                    </div>`;
                }

                return html`
                    <div ref=${containerRef} className="parallax-container relative py-16" style=${{ overflow: 'hidden' }}>
                        <div style=${{ transform: 'perspective(1000px) rotateX(' + scrollData.rotateX + 'deg) rotateZ(' + scrollData.rotateZ + 'deg) translateY(' + scrollData.translateY + 'px)', opacity: scrollData.opacity, transformStyle: 'preserve-3d', transition: 'transform 0.05s linear, opacity 0.1s linear' }}>
                            ${renderRow(row1, scrollData.row1X, 'row1')}
                            ${renderRow(row2, scrollData.row2X, 'row2')}
                            ${renderRow(row3, scrollData.row3X, 'row3')}
                        </div>
                    </div>
                `;
            }

            // ──────────────────────────────────────────────
            // COMPONENT: Globe (Three.js)
            // ──────────────────────────────────────────────
            function GlobeComponent({ className }) {
                const containerRef = useRef(null);
                const [reducedMotion, setReducedMotion] = useState(false);

                useEffect(() => {
                    setReducedMotion(window.matchMedia('(prefers-reduced-motion: reduce)').matches);
                }, []);

                useEffect(() => {
                    const container = containerRef.current;
                    if (!container || typeof THREE === 'undefined') return;
                    const scene = new THREE.Scene();
                    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
                    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                    renderer.setSize(container.clientWidth, container.clientHeight);
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                    renderer.setClearColor(0x000000, 0);
                    container.appendChild(renderer.domElement);
                    camera.position.z = 8;

                    const globeGeom = new THREE.SphereGeometry(2.5, 64, 64);
                    const globeMat = new THREE.MeshPhongMaterial({ color: 0x1a1a2e, shininess: 30, transparent: true, opacity: 0.85 });
                    const globe = new THREE.Mesh(globeGeom, globeMat);
                    scene.add(globe);

                    const wireGeom = new THREE.SphereGeometry(2.52, 32, 32);
                    const wireMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, wireframe: true, transparent: true, opacity: 0.15 });
                    const wireframe = new THREE.Mesh(wireGeom, wireMat);
                    scene.add(wireframe);

                    const ptsCount = reducedMotion ? 100 : 300;
                    const ptsGeom = new THREE.BufferGeometry();
                    const positions = new Float32Array(ptsCount * 3);
                    for (let i = 0; i < ptsCount; i++) {
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        const r = 2.55;
                        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                        positions[i * 3 + 1] = r * Math.cos(phi);
                        positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
                    }
                    ptsGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    const ptsMat = new THREE.PointsMaterial({ color: 0x22d3ee, size: 0.03, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
                    const points = new THREE.Points(ptsGeom, ptsMat);
                    scene.add(points);

                    const glowGeom = new THREE.SphereGeometry(2.7, 64, 64);
                    const glowMat = new THREE.ShaderMaterial({
                        uniforms: { color: { value: new THREE.Color(0x8b5cf6) } },
                        vertexShader: 'varying vec3 vNormal; varying vec3 vPosition; void main(){ vNormal=normalize(normalMatrix*normal); vPosition=(modelViewMatrix*vec4(position,1.0)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
                        fragmentShader: 'uniform vec3 color; varying vec3 vNormal; varying vec3 vPosition; void main(){ float intensity=pow(0.6-dot(vNormal,vec3(0.0,0.0,1.0)),3.0); gl_FragColor=vec4(color,intensity*0.5); }',
                        side: THREE.BackSide,
                        blending: THREE.AdditiveBlending,
                        transparent: true,
                        depthWrite: false
                    });
                    const glow = new THREE.Mesh(glowGeom, glowMat);
                    scene.add(glow);

                    const ambient = new THREE.AmbientLight(0x333355, 1);
                    scene.add(ambient);
                    const dirLight = new THREE.DirectionalLight(0x8b5cf6, 1.5);
                    dirLight.position.set(5, 5, 5);
                    scene.add(dirLight);
                    const ptLight = new THREE.PointLight(0x22d3ee, 2, 20);
                    ptLight.position.set(-3, 2, 4);
                    scene.add(ptLight);

                    const arcsGroup = new THREE.Group();
                    const arcCount = reducedMotion ? 3 : 8;
                    for (let i = 0; i < arcCount; i++) {
                        const sT = Math.random() * Math.PI * 2;
                        const eT = sT + Math.PI * 0.5 + Math.random() * Math.PI * 0.5;
                        const sP = Math.acos(2 * Math.random() - 1);
                        const eP = Math.acos(2 * Math.random() - 1);
                        const sR = 2.55;
                        const eR = 2.55;
                        const start = new THREE.Vector3(sR * Math.sin(sP) * Math.cos(sT), sR * Math.cos(sP), sR * Math.sin(sP) * Math.sin(sT));
                        const end = new THREE.Vector3(eR * Math.sin(eP) * Math.cos(eT), eR * Math.cos(eP), eR * Math.sin(eP) * Math.sin(eT));
                        const mid = start.clone().add(end).multiplyScalar(0.5).normalize().multiplyScalar(3.2);
                        const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
                        const curvePts = curve.getPoints(50);
                        const arcGeom = new THREE.BufferGeometry().setFromPoints(curvePts);
                        const arcMat = new THREE.LineBasicMaterial({ color: [0x22d3ee, 0x3b82f6, 0x8b5cf6, 0xd946ef][i % 4], transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
                        const arc = new THREE.Line(arcGeom, arcMat);
                        arcsGroup.add(arc);
                    }
                    scene.add(arcsGroup);

                    const ringsGroup = new THREE.Group();
                    const ringCount = reducedMotion ? 1 : 2;
                    for (let i = 0; i < ringCount; i++) {
                        const ringGeom = new THREE.TorusGeometry(2.7 + i * 0.3, 0.01, 16, 100);
                        const ringMat = new THREE.MeshBasicMaterial({ color: [0x8b5cf6, 0x22d3ee][i % 2], transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending });
                        const ring = new THREE.Mesh(ringGeom, ringMat);
                        ring.rotation.x = Math.PI / 2 + i * 0.3;
                        ring.rotation.z = i * 0.5;
                        ringsGroup.add(ring);
                    }
                    scene.add(ringsGroup);

                    let animationId;
                    const animate = function() {
                        const time = Date.now() * 0.001;
                        globe.rotation.y += reducedMotion ? 0.002 : 0.004;
                        wireframe.rotation.y = globe.rotation.y;
                        points.rotation.y = globe.rotation.y;
                        glow.rotation.y = globe.rotation.y;
                        arcsGroup.rotation.y += reducedMotion ? 0.001 : 0.002;
                        ringsGroup.rotation.y += reducedMotion ? 0.0005 : 0.001;
                        ringsGroup.rotation.x += reducedMotion ? 0.0003 : 0.0006;
                        ptLight.position.x = Math.sin(time * 0.5) * 4;
                        ptLight.position.z = Math.cos(time * 0.5) * 4;
                        renderer.render(scene, camera);
                        animationId = requestAnimationFrame(animate);
                    };
                    animate();

                    const handleResize = function() {
                        const w = container.clientWidth;
                        const h = container.clientHeight;
                        camera.aspect = w / h;
                        camera.updateProjectionMatrix();
                        renderer.setSize(w, h);
                    };
                    window.addEventListener('resize', handleResize);
                    return function() {
                        cancelAnimationFrame(animationId);
                        window.removeEventListener('resize', handleResize);
                        renderer.dispose();
                        scene.traverse(function(obj) {
                            if (obj.geometry) obj.geometry.dispose();
                            if (obj.material) {
                                if (Array.isArray(obj.material)) obj.material.forEach(function(m) { m.dispose(); });
                                else obj.material.dispose();
                            }
                        });
                        if (renderer.domElement.parentNode === container) container.removeChild(renderer.domElement);
                    };
                }, [reducedMotion]);

                return html`<div ref=${containerRef} className=${cn('globe-wrapper', className)} style=${{ width: '100%', height: '400px', borderRadius: '20px', overflow: 'hidden' }} />`;
            }

                                <p style=${{ fontSize: '0.75rem', color: '#404050' }}>© 2026 Maniesta. All rights reserved.</p>
                                <div style=${{ display: 'flex', gap: '16px' }}>
                                    <a href="#" style=${{ fontSize: '0.75rem', color: '#606070', textDecoration: 'none' }}>GitHub</a>

                            </div>
                        </div>
                    </footer>
                `;
            }

            // ──────────────────────────────────────────────
            // MAIN APP
            // ──────────────────────────────────────────────
            function App() {
                const [loading, setLoading] = useState(true);

                useEffect(() => {
                    const timer = setTimeout(function() { setLoading(false); }, 600);
                    return function() { clearTimeout(timer); };
                }, []);

                return html`
                    <div style=${{ position: 'relative', minHeight: '100vh', background: '#0a0a0f' }}>
                        ${loading ? html`
                            <div className="loader-overlay">
                                <div className="loader-spinner" />
                            </div>
                        ` : null}
                        <${Navigation} />
                        <${HeroSection} />
                        <${TracingBeam}>
                            <${ProjectsSection} />
                        <//>
                        <${TracingBeam}>
                            <${GlobalSection} />
                        <//>
                        <${TracingBeam}>
                            <${TechnologySection} />
                        <//>
                        <${TracingBeam}>
                            <${AboutSection} />
                        <//>
                        <${TracingBeam}>
                            <${FinalCTASection} />
                        <//>
                        <${Footer} />
                    </div>
                `;
            }

            // ──────────────────────────────────────────────
            // RENDER
            // ──────────────────────────────────────────────
            ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
        })();
    </script>
</body>
