    <style>
      :root {
        --bg-primary: #0a0a0f;
        --bg-secondary: #0f0f1a;
        --bg-tertiary: #14141f;
        --text-primary: #e8e8f0;
        --text-secondary: #9898b0;
        --text-muted: #606070;
        --cyan: #22d3ee;
        --blue: #3b82f6;
        --indigo: #6366f1;
        --purple: #8b5cf6;
        --violet: #a855f7;
        --magenta: #d946ef;
        --border-subtle: rgba(255, 255, 255, 0.06);
        --border-glow: rgba(139, 92, 246, 0.3);
        --glass-bg: rgba(15, 15, 30, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scrollbar-width: thin;
        scrollbar-color: #2a2a3a #0a0a0f;
      }
      body {
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        line-height: 1.6;
        min-height: 100vh;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0f;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a2a3a;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a3a4a;
      }

      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        z-index: 9998;
        opacity: 0.025;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 200px 200px;
      }
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
      }
      .gradient-text {
        background: linear-gradient(
          135deg,
          #22d3ee 0%,
          #3b82f6 25%,
          #8b5cf6 50%,
          #a855f7 75%,
          #d946ef 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .section {
        position: relative;
        padding: 80px 0;
      }
      .section-label {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 12px;
      }
      .section-title {
        font-size: 2.5rem;
        font-weight: 700;
        font-family: 'Outfit', 'Inter', sans-serif;
        letter-spacing: -0.03em;
        color: var(--text-primary);
        line-height: 1.2;
      }
      .section-description {
        color: var(--text-secondary);
        font-size: 1.05rem;
        max-width: 600px;
      }

      /* Navigation */
      .nav-blur {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        background: rgba(10, 10, 15, 0.7);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 999;
        transition: padding 0.3s ease;
      }
      .nav-link {
        position: relative;
        color: var(--text-secondary);
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        background: none;
        border: none;
      }
      .nav-link::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(90deg, #22d3ee, #8b5cf6);
        transition: width 0.3s ease;
        border-radius: 1px;
      }
      .nav-link:hover::after {
        width: 100%;
      }
      .nav-link:hover {
        color: #fff;
      }

      /* Hero */
      .hero-container {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 0 1rem;
      }
      .lamp-container {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }
      .lamp-glow {
        position: absolute;
        top: -80px;
        left: 50%;
        transform: translateX(-50%);
        width: 600px;
        height: 400px;
        background: radial-gradient(
          ellipse at top,
          rgba(34, 211, 238, 0.25) 0%,
          rgba(59, 130, 246, 0.15) 30%,
          transparent 70%
        );
        filter: blur(60px);
        pointer-events: none;
        animation: lampPulse 4s ease-in-out infinite;
      }
      @keyframes lampPulse {
        0%,
        100% {
          opacity: 0.7;
          transform: translateX(-50%) scaleY(1);
        }
        50% {
          opacity: 1;
          transform: translateX(-50%) scaleY(1.1);
        }
      }
      .lamp-beam {
        position: absolute;
        top: -40px;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: 60px;
        background: radial-gradient(
          ellipse at center,
          rgba(34, 211, 238, 0.3) 0%,
          rgba(59, 130, 246, 0.12) 40%,
          transparent 70%
        );
        filter: blur(30px);
        pointer-events: none;
      }

      /* Text hover effect */
      .text-hover-container {
        position: relative;
        cursor: pointer;
        z-index: 3;
        display: inline-block;
        width: 100%;
        max-width: 800px;
      }
      .text-hover-container svg {
        width: 100%;
        height: auto;
        overflow: visible;
        display: block;
      }

      /* Project cards */
      .project-card-3d {
        perspective: 1000px;
        transform-style: preserve-3d;
        transition: transform 0.25s ease;
        cursor: pointer;
        position: relative;
      }
      .project-card-inner {
        position: relative;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: linear-gradient(160deg, rgba(20, 20, 35, 0.9), rgba(10, 10, 20, 0.95));
        transition:
          border-color 0.3s ease,
          box-shadow 0.3s ease;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        transform-style: preserve-3d;
      }
      .project-card-inner:hover {
        border-color: rgba(139, 92, 246, 0.4);
        box-shadow:
          0 16px 48px rgba(0, 0, 0, 0.6),
          0 0 40px rgba(139, 92, 246, 0.1),
          0 0 80px rgba(34, 211, 238, 0.05);
      }
      .project-thumbnail {
        position: relative;
        width: 100%;
        height: 180px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .project-thumbnail .thumb-bg {
        position: absolute;
        inset: 0;
        opacity: 0.5;
        transition: opacity 0.3s ease;
      }
      .project-card-inner:hover .thumb-bg {
        opacity: 0.75;
      }
      .project-thumbnail .thumb-initial {
        position: relative;
        z-index: 1;
        font-size: 3rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        font-family: 'Outfit', sans-serif;
      }

      /* Globe */
      .globe-wrapper {
        position: relative;
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px rgba(139, 92, 246, 0.1);
      }

      /* Tracing beam */
      .tracing-beam-container {
        position: relative;
      }
      .tracing-beam-line {
        position: absolute;
        left: 20px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: rgba(255, 255, 255, 0.05);
        overflow: hidden;
      }
      .tracing-beam-progress {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 0;
        background: linear-gradient(180deg, #22d3ee, #3b82f6, #8b5cf6, #d946ef);
        border-radius: 1px;
        transition: height 0.1s linear;
      }
      .tracing-beam-dot {
        position: absolute;
        left: 19px;
        transform: translateX(-50%);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8b5cf6;
        box-shadow:
          0 0 12px #8b5cf6,
          0 0 24px #8b5cf6;
        z-index: 2;
        transition: top 0.1s linear;
      }

      /* Filter pills */
      .filter-pill {
        padding: 10px 22px;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(15, 15, 25, 0.6);
        color: var(--text-secondary);
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        white-space: nowrap;
        user-select: none;
      }
      .filter-pill:hover {
        border-color: rgba(139, 92, 246, 0.4);
        color: var(--text-primary);
        background: rgba(139, 92, 246, 0.1);
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.1);
      }
      .filter-pill.active {
        border-color: rgba(139, 92, 246, 0.6);
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.15), rgba(139, 92, 246, 0.2));
        color: #fff;
        box-shadow:
          0 0 30px rgba(139, 92, 246, 0.2),
          0 0 60px rgba(34, 211, 238, 0.08);
      }

      /* Buttons */
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 32px;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 0.95rem;
        color: #fff;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6, #d946ef);
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
        text-decoration: none;
      }
      .btn-primary:hover {
        box-shadow:
          0 8px 32px rgba(139, 92, 246, 0.5),
          0 0 60px rgba(34, 211, 238, 0.15);
        transform: translateY(-2px);
      }
      .btn-secondary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 28px;
        border-radius: 9999px;
        font-weight: 500;
        font-size: 0.95rem;
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
        text-decoration: none;
      }
      .btn-secondary:hover {
        border-color: rgba(139, 92, 246, 0.4);
        background: rgba(139, 92, 246, 0.1);
        box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
        transform: translateY(-2px);
      }

      /* Tech cards */
      .tech-card {
        padding: 20px 24px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(15, 15, 25, 0.7);
        transition: all 0.3s ease;
        cursor: default;
        user-select: none;
        text-align: center;
      }
      .tech-card:hover {
        border-color: rgba(139, 92, 246, 0.3);
        box-shadow:
          0 8px 32px rgba(139, 92, 246, 0.08),
          0 0 40px rgba(34, 211, 238, 0.04);
        transform: translateY(-4px);
      }
      .tech-card i {
        font-size: 1.8rem;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #22d3ee, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .tech-card-name {
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--text-primary);
      }

      /* Dotted background */
      .dotted-glow-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Reveal animation */
      .reveal-hidden {
        opacity: 0;
        transform: translateY(30px);
        transition:
          opacity 0.7s ease,
          transform 0.7s ease;
      }
      .reveal-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Parallax */
      .parallax-container {
        perspective: 1000px;
        transform-style: preserve-3d;
        overflow: hidden;
      }
      .parallax-row {
        display: flex;
        gap: 20px;
        will-change: transform;
        transform-style: preserve-3d;
        margin-bottom: 16px;
      }

      /* Mobile menu */
      .mobile-menu {
        display: none;
        background: rgba(10, 10, 15, 0.95);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding: 16px;
      }
      .mobile-menu.open {
        display: block;
        animation: fadeSlideDown 0.3s ease;
      }
      @keyframes fadeSlideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Loading */
      .loader-overlay {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        transition: opacity 0.4s ease;
      }
      .loader-spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 3px solid rgba(139, 92, 246, 0.2);
        border-top-color: #8b5cf6;
        animation: spin 1.2s linear infinite;
        box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Stats */
      .stat-value {
        font-size: 2.5rem;
        font-weight: 700;
        font-family: 'Outfit', sans-serif;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #22d3ee, #3b82f6, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 8px;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .section-title {
          font-size: 1.8rem;
        }
        .stat-value {
          font-size: 2rem;
        }
        .lamp-glow {
          width: 300px;
          height: 200px;
          top: -40px;
        }
        .project-thumbnail {
          height: 150px;
        }
        .project-thumbnail .thumb-initial {
          font-size: 2rem;
        }
        .section {
          padding: 60px 0;
        }
        .globe-wrapper {
          max-width: 100%;
        }
      }
      @media (max-width: 480px) {
        .section-title {
          font-size: 1.5rem;
        }
        .btn-primary,
        .btn-secondary {
          padding: 10px 20px;
          font-size: 0.85rem;
        }
        .lamp-glow {
          width: 200px;
          height: 150px;
          top: -20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>

        // ──────────────────────────────────────────────
        // Helper: useReveal (IntersectionObserver)
        // ──────────────────────────────────────────────
        function useReveal() {
          const ref = useRef(null);
          const [visible, setVisible] = useState(false);
          useEffect(() => {
            const el = ref.current;
            if (!el) return;
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
              setVisible(true);
              return;
            }
            const observer = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    setVisible(true);
                    observer.unobserve(entry.target);
                  }
                });
              },
              { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
            );
            observer.observe(el);
            return () => observer.disconnect();
          }, []);
          return [ref, visible];
        }

        // ──────────────────────────────────────────────
        // Component: WavyBackground (Simplex Noise)
        // ──────────────────────────────────────────────
        function WavyBackground({ colors, blur, speed, waveOpacity, className }) {
          const canvasRef = useRef(null);
          const animationRef = useRef(null);
          const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

          useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const noise = new SimplexNoise();
            let width = (canvas.width = canvas.offsetWidth);
            let height = (canvas.height = canvas.offsetHeight);
            let time = 0;
            const colorValues = (
              colors || ['#22d3ee', '#3b82f6', '#6366f1', '#8b5cf6', '#a855f7', '#d946ef']
            ).map((c) => {
              const r = parseInt(c.slice(1, 3), 16),
                g = parseInt(c.slice(3, 5), 16),
                b = parseInt(c.slice(5, 7), 16);
              return [r, g, b];
            });
            const speedFactor = speed === 'fast' ? 0.01 : speed === 'medium' ? 0.006 : 0.003;
            const bval = blur || 30;
            const wop = waveOpacity || 0.5;

            function drawWave(offsetY, amplitude, frequency, phase, color, opacity) {
              ctx.beginPath();
              ctx.moveTo(0, height / 2);
              for (let x = 0; x <= width; x += 3) {
                const y = offsetY + noise.noise3D(x / 800, 0.3 * phase, time) * 100;
                ctx.lineTo(x, y);
              }
              ctx.strokeStyle = `rgba(${color[0]},${color[1]},${color[2]},${opacity})`;
              ctx.lineWidth = 2;
              ctx.stroke();
            }

            function animate() {
              ctx.clearRect(0, 0, width, height);
              ctx.filter = `blur(${bval}px)`;
              const centerY = height * 0.5;
              colorValues.forEach((color, i) => {
                const offsetY = centerY + (i - colorValues.length / 2) * 20;
                const amplitude = 30 + i * 8;
                const frequency = 0.005 + i * 0.001;
                const opacity = wop * (1 - i * 0.08);
                drawWave(offsetY, amplitude, frequency, i, color, Math.max(0.05, opacity));
              });
              ctx.filter = 'none';
              time += reducedMotion ? 0 : speedFactor;
              animationRef.current = requestAnimationFrame(animate);
            }

            if (!reducedMotion) animate();
            else {
              colorValues.forEach((color, i) => {
                const offsetY = height * 0.5 + (i - colorValues.length / 2) * 20;
                const amplitude = 30 + i * 8;
                const opacity = wop * (1 - i * 0.08);
                drawWave(offsetY, amplitude, 0.005 + i * 0.001, i, color, Math.max(0.05, opacity));
              });
            }

            const handleResize = () => {
              width = canvas.width = canvas.offsetWidth;
              height = canvas.height = canvas.offsetHeight;
            };
            window.addEventListener('resize', handleResize);
            return () => {
              cancelAnimationFrame(animationRef.current);
              window.removeEventListener('resize', handleResize);
            };
          }, [colors ? colors.join(',') : '', blur, speed, waveOpacity, reducedMotion]);

          return html`<canvas
            ref=${canvasRef}
            className=${cn('absolute inset-0 w-full h-full', className)}
            style=${{ pointerEvents: 'none' }}
          />`;
        }

        // ──────────────────────────────────────────────
        // Component: DottedGlowBackground (canvas-based)
        // ──────────────────────────────────────────────
        function DottedGlowBackground({
          className = '',
          opacity = 1,
          gap = 12,
          radius = 1.4,
          colorDark = '#6366f1',
          glowColorDark = '#8b5cf6',
          backgroundOpacity = 0,
          speedMin = 0.3,
          speedMax = 1.6,
          speedScale = 1,
        }) {
          const canvasRef = useRef(null);
          const animationRef = useRef(null);
          const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

          useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width = (canvas.width = canvas.offsetWidth);
            let height = (canvas.height = canvas.offsetHeight);
            const dots = [];
            const spacing = gap;
            const dotRadius = radius;
            for (let x = spacing; x < width; x += spacing) {
              for (let y = spacing; y < height; y += spacing) {
                dots.push({
                  baseX: x,
                  baseY: y,
                  x,
                  y,
                  speedX:
                    (Math.random() * (speedMax - speedMin) + speedMin) *
                    (Math.random() > 0.5 ? 1 : -1) *
                    speedScale,
                  speedY:
                    (Math.random() * (speedMax - speedMin) + speedMin) *
                    (Math.random() > 0.5 ? 1 : -1) *
                    speedScale,
                  phase: Math.random() * Math.PI * 2,
                  alpha: Math.random() * 0.5 + 0.3,
                });
              }
            }
            function hexToRgb(hex) {
              const res = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
              return res
                ? { r: parseInt(res[1], 16), g: parseInt(res[2], 16), b: parseInt(res[3], 16) }
                : { r: 255, g: 255, b: 255 };
            }
            const colRGB = hexToRgb(colorDark);
            const glowRGB = hexToRgb(glowColorDark);

            function draw() {
              ctx.clearRect(0, 0, width, height);
              ctx.globalAlpha = backgroundOpacity;
              ctx.fillStyle = 'transparent';
              ctx.fillRect(0, 0, width, height);
              ctx.globalAlpha = opacity;
              const time = Date.now() * 0.001;
              dots.forEach((dot) => {
                dot.x = dot.baseX + Math.sin(time * dot.speedX + dot.phase) * 3;
                dot.y = dot.baseY + Math.cos(time * dot.speedY + dot.phase) * 3;
                const gradient = ctx.createRadialGradient(
                  dot.x,
                  dot.y,
                  0,
                  dot.x,
                  dot.y,
                  dotRadius * 4
                );
                gradient.addColorStop(
                  0,
                  `rgba(${glowRGB.r},${glowRGB.g},${glowRGB.b},${dot.alpha})`
                );
                gradient.addColorStop(
                  0.5,
                  `rgba(${glowRGB.r},${glowRGB.g},${glowRGB.b},${dot.alpha * 0.3})`
                );
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dotRadius * 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = `rgba(${colRGB.r},${colRGB.g},${colRGB.b},${dot.alpha})`;
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dotRadius, 0, Math.PI * 2);
                ctx.fill();
              });
              animationRef.current = requestAnimationFrame(draw);
            }
            function staticDraw() {
              dots.forEach((dot) => {
                const gradient = ctx.createRadialGradient(
                  dot.baseX,
                  dot.baseY,
                  0,
                  dot.baseX,
                  dot.baseY,
                  dotRadius * 4
                );
                gradient.addColorStop(
                  0,
                  `rgba(${glowRGB.r},${glowRGB.g},${glowRGB.b},${dot.alpha})`
                );
                gradient.addColorStop(
                  0.5,
                  `rgba(${glowRGB.r},${glowRGB.g},${glowRGB.b},${dot.alpha * 0.3})`
                );
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(dot.baseX, dot.baseY, dotRadius * 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = `rgba(${colRGB.r},${colRGB.g},${colRGB.b},${dot.alpha})`;
                ctx.beginPath();
                ctx.arc(dot.baseX, dot.baseY, dotRadius, 0, Math.PI * 2);
                ctx.fill();
              });
            }
            if (!reducedMotion) draw();
            else staticDraw();
            const handleResize = () => {
              width = canvas.width = canvas.offsetWidth;
              height = canvas.height = canvas.offsetHeight;
            };
            window.addEventListener('resize', handleResize);
            return () => {
              cancelAnimationFrame(animationRef.current);
              window.removeEventListener('resize', handleResize);
            };
          }, [
            opacity,
            gap,
            radius,
            colorDark,
            glowColorDark,
            backgroundOpacity,
            speedMin,
            speedMax,
            speedScale,
            reducedMotion,
          ]);

          return html`<canvas
            ref=${canvasRef}
            className=${cn('absolute inset-0 pointer-events-none', className)}
          />`;
        }

        // ──────────────────────────────────────────────
        // Component: TracingBeam
        // ──────────────────────────────────────────────
        function TracingBeam({ children, className }) {
          const containerRef = useRef(null);
          const progressRef = useRef(null);
          const dotRef = useRef(null);

          useEffect(() => {
            const container = containerRef.current;
            const progress = progressRef.current;
            const dot = dotRef.current;
            if (!container || !progress || !dot) return;
            let rafId = null;
            const updateBeam = () => {
              const rect = container.getBoundingClientRect();
              const scrollY = window.scrollY;
              const containerTop = rect.top + scrollY;
              const containerHeight = rect.height;
              const viewportHeight = window.innerHeight;
              const start = containerTop - viewportHeight * 0.5;
              const end = containerTop + containerHeight - viewportHeight * 0.5;
              const current = scrollY;
              let pct = 0;
              if (current > start && current < end) pct = ((current - start) / (end - start)) * 100;
              else if (current >= end) pct = 100;
              progress.style.height = pct + '%';
              dot.style.top = pct + '%';
              rafId = null;
            };
            const onScroll = () => {
              if (!rafId) rafId = requestAnimationFrame(updateBeam);
            };
            updateBeam();
            window.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('resize', onScroll);
            return () => {
              window.removeEventListener('scroll', onScroll);
              window.removeEventListener('resize', onScroll);
              if (rafId) cancelAnimationFrame(rafId);
            };
          }, []);

          return html`
            <div ref=${containerRef} className=${cn('tracing-beam-container relative', className)}>
              <div className="tracing-beam-line">
                <div ref=${progressRef} className="tracing-beam-progress" />
              </div>
              <div ref=${dotRef} className="tracing-beam-dot" />
              <div style=${{ paddingLeft: '48px' }}>${children}</div>
            </div>
          `;
        }

            target: ref,

            useTransform(scrollYProgress, [0, 1], [0, 1000]),

          );
          const translateXReverse = useSpring(
            useTransform(scrollYProgress, [0, 1], [0, -1000]),
            springConfig
          );
          const rotateX = useSpring(useTransform(scrollYProgress, [0, 0.2], [15, 0]), springConfig);
          const opacity = useSpring(
            useTransform(scrollYProgress, [0, 0.2], [0.2, 1]),
            springConfig
          );
          const rotateZ = useSpring(useTransform(scrollYProgress, [0, 0.2], [20, 0]), springConfig);
          const translateY = useSpring(
            useTransform(scrollYProgress, [0, 0.2], [-700, 100]),
            springConfig
          );

          return html`

        // ──────────────────────────────────────────────
        // Component: Globe (Three.js)
        // ──────────────────────────────────────────────
        function GlobeComponent({ className }) {
          const containerRef = useRef(null);
          const [reducedMotion, setReducedMotion] = useState(false);
          useEffect(
            () => setReducedMotion(window.matchMedia('(prefers-reduced-motion: reduce)').matches),
            []
          );

          useEffect(() => {
            const container = containerRef.current;
            if (!container || typeof THREE === 'undefined') return;
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(
              45,
              container.clientWidth / container.clientHeight,
              0.1,
              100
            );
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);
            camera.position.z = 8;

            const globeGeom = new THREE.SphereGeometry(2.5, 64, 64);
            const globeMat = new THREE.MeshPhongMaterial({
              color: 0x1a1a2e,
              emissive: 0x0a0a1a,
              shininess: 30,
              transparent: true,
              opacity: 0.9,
            });
            const globe = new THREE.Mesh(globeGeom, globeMat);
            scene.add(globe);

            const wireGeom = new THREE.SphereGeometry(2.52, 32, 32);
            const wireMat = new THREE.MeshBasicMaterial({
              color: 0x8b5cf6,
              wireframe: true,
              transparent: true,
              opacity: 0.2,
            });
            const wireframe = new THREE.Mesh(wireGeom, wireMat);
            scene.add(wireframe);

            const ptsCount = reducedMotion ? 100 : 300;
            const ptsGeom = new THREE.BufferGeometry();
            const positions = new Float32Array(ptsCount * 3);
            const colors = new Float32Array(ptsCount * 3);
            const palette = [
              new THREE.Color('#22d3ee'),
              new THREE.Color('#3b82f6'),
              new THREE.Color('#8b5cf6'),
              new THREE.Color('#a855f7'),
              new THREE.Color('#d946ef'),
            ];
            for (let i = 0; i < ptsCount; i++) {
              const theta = Math.random() * Math.PI * 2,
                phi = Math.acos(2 * Math.random() - 1),
                r = 2.55;
              positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
              positions[i * 3 + 1] = r * Math.cos(phi);
              positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
              const c = palette[Math.floor(Math.random() * palette.length)];
              colors[i * 3] = c.r;
              colors[i * 3 + 1] = c.g;
              colors[i * 3 + 2] = c.b;
            }
            ptsGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            ptsGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const ptsMat = new THREE.PointsMaterial({
              size: 0.04,
              vertexColors: true,
              transparent: true,
              opacity: 0.9,
              blending: THREE.AdditiveBlending,
              depthWrite: false,
            });
            const points = new THREE.Points(ptsGeom, ptsMat);
            scene.add(points);

            const glowGeom = new THREE.SphereGeometry(2.7, 64, 64);
            const glowMat = new THREE.ShaderMaterial({
              uniforms: {
                color1: { value: new THREE.Color('#8b5cf6') },
                color2: { value: new THREE.Color('#22d3ee') },
              },
              vertexShader:
                'varying vec3 vNormal; varying vec3 vPosition; void main(){ vNormal=normalize(normalMatrix*normal); vPosition=(modelViewMatrix*vec4(position,1.0)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
              fragmentShader:
                'uniform vec3 color1; uniform vec3 color2; varying vec3 vNormal; varying vec3 vPosition; void main(){ float intensity=pow(0.6-dot(vNormal,vec3(0.0,0.0,1.0)),3.0); vec3 gradient=mix(color1,color2,intensity); gl_FragColor=vec4(gradient,intensity*0.5); }',
              side: THREE.BackSide,
              blending: THREE.AdditiveBlending,
              transparent: true,
              depthWrite: false,
            });
            const glow = new THREE.Mesh(glowGeom, glowMat);
            scene.add(glow);

            const ambient = new THREE.AmbientLight(0x222244, 1.2);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0x8b5cf6, 1.5);
            dirLight.position.set(5, 5, 5);
            scene.add(dirLight);
            const ptLight1 = new THREE.PointLight(0x22d3ee, 2, 20);
            ptLight1.position.set(-3, 2, 4);
            scene.add(ptLight1);
            const ptLight2 = new THREE.PointLight(0xd946ef, 1.5, 15);
            ptLight2.position.set(4, -1, 2);
            scene.add(ptLight2);

            const arcsGroup = new THREE.Group();
            const arcCount = reducedMotion ? 6 : 12;
            const arcColors = [0x22d3ee, 0x3b82f6, 0x8b5cf6, 0xa855f7, 0xd946ef];
            for (let i = 0; i < arcCount; i++) {
              const sT = Math.random() * Math.PI * 2,
                eT = sT + Math.PI * 0.5 + Math.random() * Math.PI * 0.8;
              const sP = Math.acos(2 * Math.random() - 1),
                eP = Math.acos(2 * Math.random() - 1);
              const sR = 2.55,
                eR = 2.55;
              const start = new THREE.Vector3(
                sR * Math.sin(sP) * Math.cos(sT),
                sR * Math.cos(sP),
                sR * Math.sin(sP) * Math.sin(sT)
              );
              const end = new THREE.Vector3(
                eR * Math.sin(eP) * Math.cos(eT),
                eR * Math.cos(eP),
                eR * Math.sin(eP) * Math.sin(eT)
              );
              const mid = start
                .clone()
                .add(end)
                .multiplyScalar(0.5)
                .normalize()
                .multiplyScalar(3.2);
              const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
              const curvePts = curve.getPoints(50);
              const arcGeom = new THREE.BufferGeometry().setFromPoints(curvePts);
              const arcMat = new THREE.LineBasicMaterial({
                color: arcColors[i % arcColors.length],
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
              });
              const arc = new THREE.Line(arcGeom, arcMat);
              arcsGroup.add(arc);
            }
            scene.add(arcsGroup);

            const ringsGroup = new THREE.Group();
            const ringCount = reducedMotion ? 1 : 2;
            for (let i = 0; i < ringCount; i++) {
              const ringGeom = new THREE.TorusGeometry(2.7 + i * 0.25, 0.01, 16, 100);
              const ringMat = new THREE.MeshBasicMaterial({
                color: [0x8b5cf6, 0x22d3ee, 0xd946ef][i % 3],
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
              });
              const ring = new THREE.Mesh(ringGeom, ringMat);
              ring.rotation.x = Math.PI / 2 + i * 0.3;
              ring.rotation.z = i * 0.6;
              ringsGroup.add(ring);
            }
            scene.add(ringsGroup);

            let animationId;
            const animate = () => {
              const time = Date.now() * 0.001;
              globe.rotation.y += reducedMotion ? 0.002 : 0.004;
              wireframe.rotation.y = globe.rotation.y;
              points.rotation.y = globe.rotation.y;
              glow.rotation.y = globe.rotation.y;
              arcsGroup.rotation.y += reducedMotion ? 0.001 : 0.002;
              ringsGroup.rotation.y += reducedMotion ? 0.0005 : 0.001;
              ringsGroup.rotation.x += reducedMotion ? 0.0003 : 0.0006;
              ptLight1.position.x = Math.sin(time * 0.5) * 4;
              ptLight1.position.z = Math.cos(time * 0.5) * 4;
              ptLight2.position.x = Math.cos(time * 0.3) * 3;
              ptLight2.position.z = Math.sin(time * 0.3) * 3;
              renderer.render(scene, camera);
              animationId = requestAnimationFrame(animate);
            };
            animate();

            const handleResize = () => {
              camera.aspect = container.clientWidth / container.clientHeight;
              camera.updateProjectionMatrix();
              renderer.setSize(container.clientWidth, container.clientHeight);
            };
            window.addEventListener('resize', handleResize);
            return () => {
              cancelAnimationFrame(animationId);
              window.removeEventListener('resize', handleResize);
              renderer.dispose();
              scene.traverse((obj) => {
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                  if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
                  else obj.material.dispose();
                }
              });
              if (renderer.domElement.parentNode === container)
                container.removeChild(renderer.domElement);
            };
          }, [reducedMotion]);

          return html`<div
            ref=${containerRef}
            className=${cn('globe-wrapper', className)}
            style=${{ height: '400px' }}
          />`;
        }

        // ──────────────────────────────────────────────
        // Component: ContactSection (Email.js)
        // ──────────────────────────────────────────────
        function ContactSection() {
          const [formData, setFormData] = useState({ name: '', email: '', message: '' });
          const [status, setStatus] = useState('idle');
          const [revealRef, revealVisible] = useReveal();

          const handleChange = (e) => {
            setFormData({ ...formData, [e.target.name]: e.target.value });
          };

          const handleSubmit = async (e) => {
            e.preventDefault();
            setStatus('sending');
            try {
              // Replace these with your Email.js credentials
              const SERVICE_ID = 'YOUR_SERVICE_ID';
              const TEMPLATE_ID = 'YOUR_TEMPLATE_ID';
              const PUBLIC_KEY = 'YOUR_PUBLIC_KEY';
              await window.emailjs.send(SERVICE_ID, TEMPLATE_ID, formData, PUBLIC_KEY);
              setStatus('success');
              setFormData({ name: '', email: '', message: '' });
            } catch (error) {
              console.error('EmailJS Error:', error);
              setStatus('error');
            }
            setTimeout(() => setStatus('idle'), 5000);
          };

          return html`
            <section
              id="contact"
              className="section"
              style=${{ background: '#0a0a12', overflow: 'hidden' }}
            >
              <${DottedGlowBackground}
                className="opacity-25"
                opacity=${0.25}
                gap=${14}
                radius=${1.2}
                colorDark="#8b5cf6"
                glowColorDark="#22d3ee"
              />
              <${SparklesCore}
                id="contact-sparkles"
                className="w-full h-full"
                particleColor="#8b5cf6"
                particleDensity=${15}
                minSize=${0.3}
                maxSize=${1}
                speed=${0.4}
              />
              <div
                style=${{ maxWidth: '700px', margin: '0 auto', padding: '0 1rem', position: 'relative', zIndex: 1, textAlign: 'center' }}
              >
                <div
                  className=${cn('reveal-hidden', revealVisible ? 'reveal-visible' : '')}
                  ref=${revealRef}
                >
                  <p className="section-label" style=${{ textAlign: 'center' }}>Get in Touch</p>
                  <h2 className="section-title" style=${{ marginBottom: '20px' }}>
                    Let's Build Something.
                  </h2>
                  <p
                    style=${{ color: '#9898b0', fontSize: '1.05rem', marginBottom: '32px', maxWidth: '500px', margin: '0 auto 32px' }}
                  >
                    Have an idea, project or collaboration in mind? I'm interested in building
                    useful digital products, exploring modern technologies and working on
                    interesting ideas.
                  </p>
                  <div
                    style=${{ display: 'flex', flexDirection: 'column', gap: '16px', justifyContent: 'center', alignItems: 'center', marginBottom: '32px' }}
                  >
                    <a
                      href="mailto:maniesta01@gmail.com"
                      className="btn-secondary"
                      style=${{ textDecoration: 'none' }}
                    >
                      <i className="fas fa-envelope"></i> Email Me
                    </a>
                    <a
                      href="https://github.com/usmannmurtazaa"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="btn-secondary"
                      style=${{ textDecoration: 'none' }}
                    >
                      <i className="fab fa-github"></i> GitHub
                    </a>
                  </div>
                  <form
                    onSubmit=${handleSubmit}
                    className="glass rounded-2xl p-6 md:p-8 max-w-lg mx-auto"
                    style=${{ textAlign: 'left' }}
                  >
                    <div style=${{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                      <div>
                        <label
                          htmlFor="name"
                          style=${{ display: 'block', fontSize: '0.875rem', fontWeight: 500, color: '#d1d5db', marginBottom: '4px' }}
                          >Name</label
                        >
                        <input
                          type="text"
                          id="name"
                          name="name"
                          value=${formData.name}
                          onChange=${handleChange}
                          required
                          placeholder="Your name"
                          style=${{ width: '100%', padding: '12px 16px', borderRadius: '8px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', color: '#fff', outline: 'none', fontSize: '0.9rem' }}
                        />
                      </div>
                      <div>
                        <label
                          htmlFor="email"
                          style=${{ display: 'block', fontSize: '0.875rem', fontWeight: 500, color: '#d1d5db', marginBottom: '4px' }}
                          >Email</label
                        >
                        <input
                          type="email"
                          id="email"
                          name="email"
                          value=${formData.email}
                          onChange=${handleChange}
                          required
                          placeholder="you@example.com"
                          style=${{ width: '100%', padding: '12px 16px', borderRadius: '8px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', color: '#fff', outline: 'none', fontSize: '0.9rem' }}
                        />
                      </div>
                      <div>
                        <label
                          htmlFor="message"
                          style=${{ display: 'block', fontSize: '0.875rem', fontWeight: 500, color: '#d1d5db', marginBottom: '4px' }}
                          >Message</label
                        >
                        <textarea
                          id="message"
                          name="message"
                          rows="4"
                          value=${formData.message}
                          onChange=${handleChange}
                          required
                          placeholder="Tell me about your project..."
                          style=${{ width: '100%', padding: '12px 16px', borderRadius: '8px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', color: '#fff', outline: 'none', fontSize: '0.9rem', resize: 'none' }}
                        ></textarea>
                      </div>
                      <button
                        type="submit"
                        disabled=${status === 'sending'}
                        className="btn-primary"
                        style=${{ justifyContent: 'center', width: '100%', opacity: status === 'sending' ? 0.6 : 1, cursor: status === 'sending' ? 'not-allowed' : 'pointer' }}
                      >
                        ${
                          status === 'sending'
                            ? html`<i className="fas fa-spinner fa-spin"></i> Sending...`
                            : status === 'success'
                              ? html`<i className="fas fa-check-circle"></i> Sent!`
                              : html`<i className="fas fa-paper-plane"></i> Send Message`
                        }
                      </button>
                    </div>
                    ${status === 'error' ? html`<p style=${{ color: '#ef4444', fontSize: '0.875rem', marginTop: '12px' }}>Something went wrong. Please try again.</p>` : null}
                  </form>
                </div>
              </div>
            </section>
          `;
        }

                    </div>
                  </div>
                  <div>
                    <h4
                      style=${{ fontSize: '0.9rem', fontWeight: 600, color: '#d1d5db', marginBottom: '12px' }}
                    >
                      Contact
                    </h4>
                    <a
                      href="mailto:maniesta01@gmail.com"
                      style=${{ color: '#606070', fontSize: '0.85rem', textDecoration: 'none' }}
                      >maniesta01@gmail.com</a
                    >
                  </div>
                  <div>
                    <h4
                      style=${{ fontSize: '0.9rem', fontWeight: 600, color: '#d1d5db', marginBottom: '12px' }}
                    >
                      Social
                    </h4>
                    <div style=${{ display: 'flex', gap: '12px' }}>
                      <a
                        href="https://github.com/usmannmurtazaa"
                        target="_blank"
                        rel="noopener noreferrer"
                        style=${{ color: '#606070', fontSize: '1.5rem', textDecoration: 'none' }}
                        aria-label="GitHub"
                        ><i className="fab fa-github"></i
                      ></a>
                    </div>
                  </div>
                </div>
                <div
                  style=${{ display: 'flex', justifyContent: 'center', paddingTop: '24px', borderTop: '1px solid rgba(255,255,255,0.05)' }}
                >
                  <p style=${{ fontSize: '0.75rem', color: '#404050' }}>
                    © 2026 Maniesta. All rights reserved.
                  </p>
                </div>
              </div>
            </footer>
          `;
        }

        // ──────────────────────────────────────────────
        // Main App
        // ──────────────────────────────────────────────
        function App() {
          const [loading, setLoading] = useState(true);
          useEffect(() => {
            const timer = setTimeout(() => setLoading(false), 600);
            return () => clearTimeout(timer);
          }, []);

          return html`
            <div style=${{ position: 'relative', minHeight: '100vh', background: '#0a0a0f' }}>
              ${loading ? html`<div className="loader-overlay"><div className="loader-spinner" /></div>` : null}
              <${Navigation} />
              <${HeroSection} />
              <${TracingBeam}><${ProjectsSection} /><//>
              <${TracingBeam}><${GlobalSection} /><//>
              <${TracingBeam}><${TechnologySection} /><//>
              <${TracingBeam}><${AboutSection} /><//>
              <${TracingBeam}><${ContactSection} /><//>
              <${Footer} />
            </div>
          `;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
      })();
    </script>
  </body>
